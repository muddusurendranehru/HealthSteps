<!DOCTYPE html>
<html lang="en" class="auth-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HealthStep</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🏥 HealthStep</div>
            <div class="subtitle">Create Your Health Tracking Account</div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required data-testid="input-email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required data-testid="input-password">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required data-testid="input-confirm-password">
                </div>
                
                <button type="submit" class="btn btn-primary" data-testid="button-signup">Create Account</button>
                
                <div id="signupMessage"></div>
            </form>
            
            <a href="login.html" class="link">Already have an account? Sign in</a>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
