<!DOCTYPE html>
<html lang="en" class="auth-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - HealthStep</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🏥 HealthStep</div>
            <div class="subtitle">Welcome Back to Your Health Journey</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required data-testid="input-email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required data-testid="input-password">
                </div>
                
                <button type="submit" class="btn btn-primary" data-testid="button-login">Sign In</button>
                
                <div id="loginMessage"></div>
            </form>
            
            <a href="signup.html" class="link">Don't have an account? Create one</a>
            <a href="index.html" class="link">← Back to Home</a>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
